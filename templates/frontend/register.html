{% extends "frontend/base.html" %}

{% block title %}Register — PayFlow{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Create your account</h2>
    <form id="register-form">
        <div class="form-group">
            <label for="first_name">First name</label>
            <input type="text" id="first_name" required>
        </div>
        <div class="form-group">
            <label for="last_name">Last name</label>
            <input type="text" id="last_name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="phone_number">Phone number</label>
            <input type="text" id="phone_number" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
        </div>
        <div id="register-error" class="form-message form-message-error"></div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
