{% extends "frontend/base.html" %}
{% load static %}

{% block title %}Register — PayFlow{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Create your account</h2>

    <!-- id="register-form" lets our JS find and control this form -->
    <form id="register-form">
        <div class="form-group">
            <label for="first_name">First name</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="form-group">
            <label for="last_name">Last name</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="phone_number">Phone number</label>
            <input type="text" id="phone_number" name="phone_number" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <!-- Errors from the API get inserted here by JavaScript -->
        <div id="register-error" class="form-error"></div>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
