 {% extends "frontend/base.html" %}

{% block title %}Wallet — PayFlow{% endblock %}

{% block content %}
<div class="wallet-page">
    <h2>My Wallet</h2>

    <div class="card">
        <h3>Current Balance</h3>
        <p class="balance" id="wallet-page-balance">Loading...</p>
    </div>

    <div class="dashboard-grid">
       
        <div class="card">
            <h3>Add Funds</h3>
            <form id="deposit-form">
                <div class="form-group">
                    <label for="deposit-amount">Amount (ZAR)</label>
                    <input type="number" id="deposit-amount" step="0.01" min="0.01" required>
                </div>
                <div id="deposit-message" class="form-message"></div>
                <button type="submit" class="btn btn-primary btn-block">Deposit</button>
            </form>
        </div>

        
        <div class="card">
            <h3>Withdraw Funds</h3>
            <form id="withdraw-form">
                <div class="form-group">
                    <label for="withdraw-amount">Amount (ZAR)</label>
                    <input type="number" id="withdraw-amount" step="0.01" min="0.01" required>
                </div>
                <div id="withdraw-message" class="form-message"></div>
                <button type="submit" class="btn btn-primary btn-block">Withdraw</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
