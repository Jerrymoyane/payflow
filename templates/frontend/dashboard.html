{% extends "frontend/base.html" %}

{% block title %}Dashboard — PayFlow{% endblock %}

{% block content %}
<div class="dashboard">
    <h2 id="welcome-message">Welcome</h2>

    <div class="dashboard-grid">
        <div class="card">
            <h3>Wallet Balance</h3>
            <!-- Filled in by JS once the API responds -->
            <p class="balance" id="wallet-balance">Loading...</p>
        </div>

        <div class="card">
            <h3>Account</h3>
            <p id="account-email">Loading...</p>
            <p id="account-phone"></p>
        </div>
    </div>

    <div class="card">
        <h3>Recent Transactions</h3>
        <!-- JS will insert <tr> rows here -->
        <table class="transactions-table">
            <thead>
                <tr>
                    <th>Reference</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="transactions-body">
                <tr><td colspan="5">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
